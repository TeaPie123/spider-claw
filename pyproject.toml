# 作用：声明统一任务服务的运行与测试依赖。
# 流程：uv 解析项目配置 → 生成锁文件 → 安装一致的运行环境。
[project]
name = "spider-claw"
version = "0.2.0"
description = "spider claw isolated development task service"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.6.12,<0.7",
    "langchain>=1.5,<2",
    "langchain-openai>=1.8,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "psycopg[binary,pool]>=3.3,<4",
    "arq>=0.28,<0.29",
    "redis>=5.3,<6",
    "fastapi>=0.165,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.16,<3",
    "loguru>=0.7,<1",
    "prometheus-client>=0.25,<1",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.8,<2"]
mcp = ["langchain-mcp-adapters>=0.3,<1"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.5,<2", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
